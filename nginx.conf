server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API proxy to backend
    # This will proxy all /api/* requests to the backend service
    # BACKEND_URL is set via environment variable (default: http://localhost:8000)
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Required for SSE (Server-Sent Events) streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;

        # CORS headers (if backend doesn't set them)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Confluence API proxy — MUST use domain (e.g. https://your-site.atlassian.net), never IP.
    # CloudFront/Atlassian require SNI hostname; IP causes SSL_do_handshake() failed.
    location /confluence-api/ {
        proxy_pass ${CONFLUENCE_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${CONFLUENCE_HOST};
        proxy_set_header Host ${CONFLUENCE_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Remove /confluence-api prefix
        rewrite ^/confluence-api/(.*) /$1 break;
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;

        # index.html and any SPA fallback response: never cache. The
        # entry point references hashed asset bundles — if the browser
        # holds an old index.html it keeps loading stale asset URLs
        # after a deploy. The nested static-asset block below overrides
        # this for hashed files, which are content-addressed and safe
        # to cache forever.
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;

        # Cache static assets — Vite emits content-hashed filenames so
        # they are safe to cache forever. The `always` flag is required
        # for nginx to override the parent block's add_header directives.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
